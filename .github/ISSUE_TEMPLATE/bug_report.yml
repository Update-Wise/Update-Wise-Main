
name: "🐛 Bug Report"
description: "Report unexpected behavior or a defect."
title: "[BUG] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping us improve UpdateWise.
        Please provide enough detail for us to reproduce the issue.

  - type: textarea
    id: summary
    attributes:
      label: Bug Description
      description: What is happening?
      placeholder: Describe the issue clearly.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: List the steps needed to reproduce the issue.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What happens instead?
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Operating System
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: UpdateWise Version
      placeholder: "e.g., 1.0.0 or related commit"

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add relevant logs, screenshots, or other details.
